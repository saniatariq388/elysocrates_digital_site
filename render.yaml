services:
  - type: web
    name: elysocrates-api
    runtime: python
    rootDir: backend
    buildCommand: uv sync --frozen
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Secrets are never stored here: set each value in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_MEDIA_BUCKET
        value: media
      - key: MAX_UPLOAD_MB
        value: "8"
